[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-managed-services-platform"
version = "0.11.0"
description = "Evidence-driven Azure and hybrid-cloud operations for managed service providers"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ahmed Hassan"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
azure-msp = "azure_msp.cli:main"
azure-msp-collect = "azure_msp.live_cli:main"
azure-msp-recovery = "azure_msp.recovery_cli:main"
azure-msp-change = "azure_msp.change_cli:main"
azure-msp-incident = "azure_msp.incident_cli:main"
azure-msp-finops = "azure_msp.finops_cli:main"
azure-msp-migration = "azure_msp.migration_cli:main"
azure-msp-ai-release = "azure_msp.ai_production_cli:main"
azure-msp-network = "azure_msp.network_cli:main"
azure-msp-data = "azure_msp.data_cli:main"
azure-msp-capacity = "azure_msp.capacity_cli:main"
azure-msp-commercial = "azure_msp.commercial_cli:main"
azure-msp-ai-value = "azure_msp.ai_value_cli:main"
azure-msp-managed-ai = "azure_msp.managed_ai_cli:main"
azure-msp-partner-cloud = "azure_msp.partner_cloud_cli:main"
azure-msp-inference-fleet = "azure_msp.inference_fleet_cli:main"
azure-msp-backup-resolution = "azure_msp.backup_resolution_cli:main"
azure-msp-resolution-network = "azure_msp.resolution_network_cli:main"
azure-msp-service-delivery = "azure_msp.service_delivery_cli:main"
azure-msp-recovery-operator = "azure_msp.recovery_operator_cli:main"
azure-msp-ai-service = "azure_msp.ai_service_operator_cli:main"
azure-msp-production-resolution = "azure_msp.production_resolution_cli:main"
azure-msp-customer-gateway = "azure_msp.customer_gateway_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
