name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: PYTHONPATH=src python tests/run_smoke.py
      - run: python -m azure_msp.cli examples/customer-inventory.json --output /tmp/report.json --html /tmp/report.html
      - run: python -m azure_msp.live_cli --help
      - run: >-
          python -m azure_msp.recovery_cli
          examples/recovery-contract.json
          examples/recovery-drill-events.json
          --isolated-network
          --approval workload-owner
          --approval cloud-operations
          --output /tmp/recovery-report.json
      - run: >-
          python -m azure_msp.change_cli
          examples/change-contract.json
          examples/change-observations.json
          --approval workload-owner
          --approval cloud-operations
          --approval financial-owner
          --output /tmp/change-report.json
      - run: >-
          python -m azure_msp.incident_cli
          examples/incident-contract.json
          examples/incident-evidence.json
          --action rollback_deployment
          --approval workload-owner
          --approval cloud-operations
          --output /tmp/incident-report.json
      - run: >-
          python -m azure_msp.finops_cli
          examples/finops-evidence.json
          --approval workload-owner
          --approval financial-owner
          --approval cloud-operations
          --output /tmp/finops-report.json
      - run: >-
          python -m azure_msp.migration_cli
          examples/migration-evidence.json
          --approval application-owner
          --approval cloud-operations
          --approval business-owner
          --output /tmp/migration-report.json
      - run: >-
          python -m azure_msp.ai_production_cli
          examples/ai-release-evidence.json
          --approval product-owner
          --approval ai-operations
          --approval financial-owner
          --output /tmp/ai-release-report.json
      - run: >-
          python -m azure_msp.network_cli
          examples/network-change-evidence.json
          --approval network-owner
          --approval application-owner
          --approval cloud-operations
          --output /tmp/network-report.json
